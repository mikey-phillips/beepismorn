<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Morning">
<title>Morning Routine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
  /* Layout: one narrow column, a daily summary strip, then one card per habit with its Mon–Sun week row. */
  :root {
    --bg: #edf1f5;
    --card: #ffffff;
    --fg: #17202a;
    --muted: #5d6b79;
    --line: #dbe2ea;
    --done: #23845a;
    --done-soft: #e2f3ea;
    --sun: #e48a12;
    --water: #2b7fd0;
    --teeth: #7a5cc7;
    --focus: #2b7fd0;
    --display: "Bricolage Grotesque", -apple-system, "SF Pro Display", system-ui, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1419; --card: #1a2129; --fg: #edf1f5; --muted: #98a6b4; --line: #2a333d;
      --done: #57c08a; --done-soft: #183126; --sun: #f2a33a; --water: #5aa6ee; --teeth: #a48ce6;
      --focus: #5aa6ee; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1419; --card: #1a2129; --fg: #edf1f5; --muted: #98a6b4; --line: #2a333d;
    --done: #57c08a; --done-soft: #183126; --sun: #f2a33a; --water: #5aa6ee; --teeth: #a48ce6;
    --focus: #5aa6ee; color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(20px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  }
  main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
  h1 { font-family: var(--display); font-size: 30px; font-weight: 700; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
  .date { color: var(--muted); font-size: 15px; margin: 0; }

  .summary {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .num { font-family: var(--display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .lbl { font-size: 13px; color: var(--muted); }

  .habit {
    --accent: var(--muted);
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 14px; display: flex; flex-direction: column; gap: 12px;
  }
  .habit button {
    width: 100%; display: flex; align-items: center; gap: 14px;
    padding: 14px; min-height: 72px;
    border: 2px solid var(--accent); border-radius: 14px;
    background: transparent; color: var(--fg);
    font: inherit; font-size: 18px; font-weight: 600; text-align: left;
    cursor: pointer; transition: transform .1s, background-color .2s, border-color .2s;
  }
  .habit button:active { transform: scale(0.98); }
  .habit button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .glyph {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }
  .glyph svg { width: 24px; height: 24px; }
  .label { flex: 1; min-width: 0; }
  .status { font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .habit.is-done button { background: var(--done-soft); border-color: var(--done); }
  .habit.is-done .status { color: var(--done); font-weight: 600; }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .dot { width: 100%; height: 10px; border-radius: 5px; background: var(--line); }
  .day.hit .dot { background: var(--accent); }
  .day.today { color: var(--fg); font-weight: 700; }
  .left { margin: 0; font-size: 15px; color: var(--muted); }
  .left strong { color: var(--fg); font-variant-numeric: tabular-nums; }

  .note { margin: 0; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }
  .note.warn { color: var(--sun); }

  @media (prefers-reduced-motion: reduce) { .habit button { transition: none; } }
</style>
</head>
<body>

<main>
  <header>
    <h1>Good morning</h1>
    <p class="date" id="date"></p>
  </header>

  <section class="summary" aria-label="Summary">
    <div class="stat"><span class="num" id="today-num">0/3</span><span class="lbl">done today</span></div>
    <div class="stat"><span class="num" id="left-num">21</span><span class="lbl">sessions left this week</span></div>
  </section>

  <div id="habits" style="display:flex;flex-direction:column;gap:14px"></div>

  <p class="note" id="sync-note" hidden></p>
  <p class="note">Tap a habit to log it for today. Tap again to undo.<br>Each week runs Monday to Sunday.</p>
</main>

<script>
  const ICONS = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    water: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-.3 0-.5.1-.7.4C9 6 5.5 10.6 5.5 14.5a6.5 6.5 0 0 0 13 0c0-3.9-3.5-8.5-5.8-11.6-.2-.3-.4-.4-.7-.4z"/></svg>',
    teeth: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 3C5 3 3.5 5 3.5 7.6c0 2 .8 3.4 1.4 5 .6 1.7.8 3.6 1.2 5.6.3 1.6.8 2.8 1.9 2.8 1.4 0 1.6-2 2-4 .3-1.4.9-2.4 2-2.4s1.7 1 2 2.4c.4 2 .6 4 2 4 1.1 0 1.6-1.2 1.9-2.8.4-2 .6-3.9 1.2-5.6.6-1.6 1.4-3 1.4-5C20.5 5 19 3 16.5 3c-1.9 0-2.9 1-4.5 1S9.4 3 7.5 3z"/></svg>',
  };
  const HABITS = [
    { id: "sun",   label: "2 Minutes of Sunlight", color: "var(--sun)" },
    { id: "water", label: "7 Gulps of Water",      color: "var(--water)" },
    { id: "teeth", label: "Brush Teeth",           color: "var(--teeth)" },
  ];
  const GOAL = 7;
  const LOCAL_KEY = "morning-routine-v1";
  const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

  // State: { sun: ["2026-11-17", ...], water: [...], teeth: [...] }
  function blank() { const o = {}; HABITS.forEach(h => o[h.id] = []); return o; }
  function clean(raw) {
    const o = blank();
    if (raw && typeof raw === "object") HABITS.forEach(h => {
      if (Array.isArray(raw[h.id])) o[h.id] = raw[h.id].filter(d => typeof d === "string");
    });
    return o;
  }
  function loadLocal() { try { return clean(JSON.parse(localStorage.getItem(LOCAL_KEY))); } catch (e) { return blank(); } }
  function saveLocal(s) { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); } catch (e) {} }

  let state = loadLocal();
  let docRef = null;          // set when your account storage is available
  let writing = Promise.resolve();

  function key(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function weekDays(now) {
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    start.setDate(start.getDate() - (start.getDay() + 6) % 7);   // back to Monday
    return Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return key(d); });
  }

  function note(text, warn) {
    const el = document.getElementById("sync-note");
    el.textContent = text || "";
    el.hidden = !text;
    el.classList.toggle("warn", !!warn);
  }

  function toggle(id) {
    const today = key(new Date());
    const list = state[id].slice();
    const i = list.indexOf(today);
    if (i === -1) list.push(today); else list.splice(i, 1);
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 56);   // keep about 8 weeks
    state = { ...state, [id]: list.filter(d => d >= key(cutoff)) };
    saveLocal(state);
    render();
    if (docRef) {
      const snapshot = state;
      writing = writing.then(() => docRef.set(snapshot)).catch(() => {
        note("Couldn't save to your account just now. It's saved on this device.", true);
      });
    }
  }

  function render() {
    const now = new Date();
    const today = key(now);
    const week = weekDays(now);
    document.getElementById("date").textContent =
      now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    const wrap = document.getElementById("habits");
    wrap.textContent = "";
    let doneToday = 0, totalLeft = 0;

    HABITS.forEach(h => {
      const done = state[h.id].includes(today);
      const count = week.filter(d => state[h.id].includes(d)).length;
      const left = Math.max(0, GOAL - count);
      if (done) doneToday++;
      totalLeft += left;

      const card = document.createElement("section");
      card.className = "habit" + (done ? " is-done" : "");
      card.style.setProperty("--accent", h.color);
      card.innerHTML = `
        <button type="button" id="btn-${h.id}" aria-pressed="${done}">
          <span class="glyph" aria-hidden="true">${ICONS[h.id]}</span>
          <span class="label">${h.label}</span>
          <span class="status">${done ? "✓ Done" : "Tap to log"}</span>
        </button>
        <div class="week" aria-label="This week">
          ${week.map((d, i) => `<div class="day${state[h.id].includes(d) ? " hit" : ""}${d === today ? " today" : ""}"><div class="dot"></div>${DAY_NAMES[i]}</div>`).join("")}
        </div>
        <p class="left">${left === 0
          ? `<strong>Goal reached!</strong> ${count} of ${GOAL} this week`
          : `<strong>${left}</strong> ${left === 1 ? "session" : "sessions"} left this week · ${count} of ${GOAL} done`}</p>`;
      card.querySelector("button").addEventListener("click", () => toggle(h.id));
      wrap.appendChild(card);
    });

    document.getElementById("today-num").textContent = `${doneToday}/${HABITS.length}`;
    document.getElementById("left-num").textContent = totalLeft;
  }

  render();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

  // Save to your Claude account when signed in, so progress follows you between devices.
  (async () => {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    docRef = db.doc("data/users/" + uid + "/routine");
    const timer = setTimeout(() => note("Can't reach your saved progress yet. Taps are kept on this device.", true), 10000);
    docRef.onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); note(""); }
      if (snap.exists) {
        state = clean(snap.data());
        saveLocal(state);
        render();
      } else if (!snap.metadata.fromCache && HABITS.some(h => state[h.id].length)) {
        // First visit with account storage: carry over anything logged on this device.
        const snapshot = state;
        writing = writing.then(() => docRef.set(snapshot)).catch(() => {});
      }
    }, () => {
      clearTimeout(timer);
      docRef = null;
      note("Saving on this device only.");
    });
  })();
</script>
</body>
</html>
