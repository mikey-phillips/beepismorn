<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>My Morning Routine</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #26332e;
      --muted: #68756e;
      --paper: #f7f5ef;
      --card: #ffffff;
      --green: #2f6d52;
      --green-dark: #24543f;
      --line: #e6e8df;
      --soft-green: #e9f2eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: max(24px, env(safe-area-inset-top)) 18px
        max(24px, env(safe-area-inset-bottom));
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 560px);
      margin: 0 auto;
    }

    .eyebrow {
      margin: 10px 0 8px;
      color: var(--green);
      font-size: 0.8rem;
      font-weight: 750;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 2.8rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 12px 0 24px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .week-card {
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
    }

    .week-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .week-heading strong { font-size: 1rem; }

    #week-range {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: right;
    }

    .habit-list {
      display: grid;
      gap: 14px;
    }

    .habit {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
    }

    .habit-top {
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    .icon {
      display: grid;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      place-items: center;
      border-radius: 15px;
      background: var(--soft-green);
      font-size: 1.45rem;
    }

    h2 {
      margin: 1px 0 5px;
      font-size: 1.08rem;
      line-height: 1.3;
    }

    .progress-copy {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .progress-track {
      height: 9px;
      margin: 16px 0 14px;
      overflow: hidden;
      border-radius: 99px;
      background: #edf0e9;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
      transition: width 180ms ease;
    }

    button {
      width: 100%;
      min-height: 52px;
      padding: 12px 16px;
      border: 0;
      border-radius: 14px;
      background: var(--green);
      color: white;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:active:not(:disabled) { background: var(--green-dark); }

    button:focus-visible {
      outline: 3px solid #e1a943;
      outline-offset: 3px;
    }

    button:disabled {
      background: #e9eee9;
      color: #53645a;
      cursor: default;
    }

    .note, #save-status {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .note { margin: 18px 4px 0; }
    #save-status { min-height: 1.3em; margin: 10px 4px 0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little care, each day</p>
    <h1>My morning routine</h1>
    <p class="intro">Small steps count. Tap each button when you’ve done it.</p>

    <section class="week-card" aria-label="This week's progress">
      <div class="week-heading">
        <strong>This week</strong>
        <span id="week-range"></span>
      </div>
    </section>

    <section class="habit-list" aria-label="Daily habits">
      <article class="habit" data-habit="sun">
        <div class="habit-top">
          <div class="icon" aria-hidden="true">☀️</div>
          <div>
            <h2>Getting 2 Min. of Sun</h2>
            <p class="progress-copy" id="sun-progress"></p>
          </div>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Sun sessions this week"
             aria-valuemin="0" aria-valuemax="6" aria-valuenow="0">
          <div class="progress-fill"></div>
        </div>
        <button type="button" data-log="sun">Log getting 2 min. of sun</button>
      </article>

      <article class="habit" data-habit="water">
        <div class="habit-top">
          <div class="icon" aria-hidden="true">💧</div>
          <div>
            <h2>Drinking 7 Gulps of Water</h2>
            <p class="progress-copy" id="water-progress"></p>
          </div>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Water sessions this week"
             aria-valuemin="0" aria-valuemax="6" aria-valuenow="0">
          <div class="progress-fill"></div>
        </div>
        <button type="button" data-log="water">Log drinking 7 gulps of water</button>
      </article>

      <article class="habit" data-habit="teeth">
        <div class="habit-top">
          <div class="icon" aria-hidden="true">🪥</div>
          <div>
            <h2>Brushing my Teeth</h2>
            <p class="progress-copy" id="teeth-progress"></p>
          </div>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Tooth-brushing sessions this week"
             aria-valuemin="0" aria-valuemax="6" aria-valuenow="0">
          <div class="progress-fill"></div>
        </div>
        <button type="button" data-log="teeth">Log brushing my teeth</button>
      </article>
    </section>

    <p class="note">Each habit can be logged once per day. Progress is saved in this browser on this device.</p>
    <p id="save-status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const STORAGE_KEY = "morning-routine-dashboard-v1";
    const TARGET = 6;
    const HABITS = ["sun", "water", "teeth"];
    let logs = loadLogs();

    function localDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function getWeekStart(date) {
      const monday = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const daysSinceMonday = (monday.getDay() + 6) % 7;
      monday.setDate(monday.getDate() - daysSinceMonday);
      return monday;
    }

    function loadLogs() {
      const empty = { sun: [], water: [], teeth: [] };
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved || typeof saved !== "object") return empty;
        for (const habit of HABITS) {
          empty[habit] = Array.isArray(saved[habit])
            ? saved[habit].filter(value => typeof value === "string")
            : [];
        }
      } catch {
        // If browser storage is unavailable or unreadable, the dashboard still works for this visit.
      }
      return empty;
    }

    function saveLogs() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
        document.getElementById("save-status").textContent = "Progress saved on this device.";
      } catch {
        document.getElementById("save-status").textContent =
          "Your check-in is shown for now, but this browser could not save it.";
      }
    }

    function render() {
      const today = new Date();
      const todayKey = localDateKey(today);
      const monday = getWeekStart(today);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      const dateOptions = { month: "short", day: "numeric" };
      document.getElementById("week-range").textContent =
        `${monday.toLocaleDateString(undefined, dateOptions)} – ${sunday.toLocaleDateString(undefined, dateOptions)}`;

      const weekKeys = new Set();
      for (let offset = 0; offset < 7; offset++) {
        const date = new Date(monday);
        date.setDate(monday.getDate() + offset);
        weekKeys.add(localDateKey(date));
      }

      for (const habit of HABITS) {
        const card = document.querySelector(`[data-habit="${habit}"]`);
        const thisWeekCount = new Set(logs[habit].filter(key => weekKeys.has(key))).size;
        const progress = Math.min(thisWeekCount, TARGET);
        const remaining = Math.max(TARGET - thisWeekCount, 0);
        const button = card.querySelector("button");
        const bar = card.querySelector('[role="progressbar"]');

        document.getElementById(`${habit}-progress`).textContent =
          `${progress} of ${TARGET} this week · ${remaining} ${remaining === 1 ? "session" : "sessions"} left`;
        card.querySelector(".progress-fill").style.width = `${(progress / TARGET) * 100}%`;
        bar.setAttribute("aria-valuenow", progress);

        const doneToday = logs[habit].includes(todayKey);
        button.disabled = doneToday;
        button.textContent = doneToday ? "Done today ✓" : button.dataset.log === "sun"
          ? "Log getting 2 min. of sun"
          : button.dataset.log === "water"
            ? "Log drinking 7 gulps of water"
            : "Log brushing my teeth";
      }
    }

    document.querySelectorAll("[data-log]").forEach(button => {
      button.addEventListener("click", () => {
        const habit = button.dataset.log;
        const todayKey = localDateKey(new Date());
        if (!logs[habit].includes(todayKey)) {
          logs[habit].push(todayKey);
          saveLogs();
          render();
        }
      });
    });

    render();
  </script>
</body>
</html>
